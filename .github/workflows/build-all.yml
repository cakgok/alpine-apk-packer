name: Build All
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.read.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        # flatten whole apps.json on a single line with -c
        run: echo "apps=$(jq -c . apps.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    # without this the job is named after every matrix key: "build (jellyseerr, seerr, seerr-team/seerr, 5055)"
    name: ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        # two lists like app: [...] and arch: [...] give you every combination
        # include gives just what you need
        # list is not a matrix job: it runs once, as a single job, and writes one output. That's safe.
        include: ${{ fromJSON(needs.list.outputs.apps) }}
    uses: ./.github/workflows/build.yml
    with:
      APP: ${{ matrix.app }}
    secrets: inherit

  publish:
    needs: build
    # released is "true" if any matrix entry released: entries that didn't release leave it empty,
    # and an empty output never overwrites a set one. !cancelled() so one failed app doesn't block the rest.
    if: ${{ !cancelled() && needs.build.outputs.released == 'true' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
